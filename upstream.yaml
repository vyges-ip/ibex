schema_version: "vyges-upstream-v1"
upstream:
  type: "standalone"
  repo: https://github.com/lowRISC/ibex
  branch: master
  commit: 022f084096baed0a9b5ebdf697ed2965f13e8ed8
import:
  rtl:
    - path: "rtl"
      map_to: "rtl"
  patches:
    - path: "vendor/patches"
      map_to: "vendor/patches"
  license:
    - path: "LICENSE"
  readme:
    - path: "README.md"
exclude:
# All other directories excluded by default
# Add more as needed
license:
  spdx: Apache-2.0
  file: LICENSE
metadata_locked: true
# Vyges-authored overlay content — excluded from upstream sync. See
# vyges-metadata.json vyges_overlays[] for the list of overridden paths.
vyges_authored:
  exclude_from_sync:
    - "vyges-overlays/"
# Sync policy: upstream pulls proceed normally; any upstream change to a
# path listed in vyges_overlays[].replaces is flagged for human review —
# upstream may have fixed the original issue, making the overlay obsolete.
sync_policy:
  overlay_conflict: "flag-for-review"
